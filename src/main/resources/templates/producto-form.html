<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${producto.id == null} ? 'Agregar Producto' : 'Editar Producto'">Formulario Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 th:text="${producto.id == null} ? 'Agregar Producto' : 'Editar Producto'"></h4>
            </div>
            <div class="card-body">
                <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

                    <!-- Campo oculto para el ID (solo en edición) -->
                    <input type="hidden" th:field="*{id}"/>

                    <!-- Nombre -->
                    <div class="mb-3">
                        <label class="form-label">Nombre del Producto</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ejemplo: Martillo" required>
                    </div>

                    <!-- Descripción -->
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="3" placeholder="Ejemplo: Martillo de acero con mango de goma" required></textarea>
                    </div>

                    <!-- Precio -->
                    <div class="mb-3">
                        <label class="form-label">Precio (S/)</label>
                        <input type="number" step="0.01" th:field="*{precio}" class="form-control" placeholder="Ejemplo: 12.50" required>
                    </div>

                    <!-- Cantidad -->
                    <div class="mb-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" th:field="*{cantidad}" class="form-control" placeholder="Ejemplo: 50" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/productos}" class="btn btn-secondary">Volver</a>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
