<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Registro de Usuario</title>

    <!-- FAVICON, Icono en la pestaña del navegador -->
    <link rel="icon" type="image/png" href="/img/IconoFerreteria_2.png" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #eef2f5;
      }
      .register-card {
        max-width: 480px;
        margin: 50px auto;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card register-card shadow">
        <div class="card-body p-4">
          <h3 class="text-center mb-3 fw-bold">Crear Cuenta</h3>

          <!-- Error -->
          <div th:if="${error}" class="alert alert-danger text-center">
            <span th:text="${error}"></span>
          </div>

          <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <div class="mb-3">
              <label class="form-label">Nombre de Usuario</label>
              <input
                class="form-control"
                th:field="*{nombreUsuario}"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Correo Electrónico</label>
              <input
                type="email"
                class="form-control"
                th:field="*{email}"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control"
                th:field="*{password}"
                required
              />
            </div>

            <button type="submit" class="btn btn-success w-100">
              Registrarse
            </button>
          </form>

          <p class="text-center mt-3">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}">Inicia sesión</a>
          </p>

          <div class="text-center mt-3">
            <a th:href="@{/}">⬅ Volver al Inicio</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
