<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Iniciar Sesión</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/img/IconoFerreteria_2.png" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f2f4f7;
      }

      .login-card {
        max-width: 420px;
        margin: 80px auto;
        border-radius: 12px;
      }

      .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.1rem rgba(13, 110, 253, 0.25);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card login-card shadow">
        <div class="card-body p-4">
          <h3 class="text-center mb-3 fw-bold">Iniciar Sesión</h3>

          <!-- Mensaje de error -->
          <div th:if="${error}" class="alert alert-danger text-center">
            <span th:text="${error}"></span>
          </div>

          <!-- Mensaje de exito -->
          <div th:if="${mensaje}" class="alert alert-success text-center">
            <span th:text="${mensaje}"></span>
          </div>

          <!-- FORMULARIO LOGIN -->
          <form th:action="@{/login}" method="post">
            <!-- Este pedazo de codigo es cuando en el futuro activamos Spring Security, evita errores CSRF -->
            <!-- <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            /> -->

            <div class="mb-3">
              <label class="form-label">Nombre de Usuario</label>
              <input
                type="text"
                class="form-control"
                name="nombreUsuario"
                placeholder="Ingrese su nombre de usuario"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control"
                name="password"
                placeholder="Ingrese su contraseña"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary w-100">Entrar</button>
          </form>

          <!-- Registro -->
          <p class="text-center mt-3">
            ¿No tienes cuenta?
            <a th:href="@{/registro}" class="fw-bold">Regístrate aquí</a>
          </p>

          <!-- Volver -->
          <div class="text-center mt-3">
            <a th:href="@{/}" class="text-decoration-none"
              >⬅ Volver al Inicio</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
