<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- ===== NAVBAR SUPERIOR (LOGO + USUARIO) ===== -->
    <nav th:fragment="navbar" class="navbar navbar-dark bg-dark shadow-sm py-2">
      <div class="container">
        <!-- FILA 1: LOGO A LA IZQUIERDA - USUARIO A LA DERECHA -->
        <div class="d-flex justify-content-between align-items-center w-100">
          <!-- LOGO + TÍTULO -->
          <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <img
              src="/img/IconoFerreteria_2.png"
              alt="Logo"
              style="width: 40px; height: 40px"
            />
            <span class="fw-bold fs-4">Ferretería Toñito</span>
          </a>

          <!-- DERECHA: LOGIN O USUARIO -->
          <div class="d-flex align-items-center gap-3">
            <!-- Si NO está logeado -->
            <div th:if="${session.usuarioLogeado == null}">
              <a href="/login" class="btn btn-outline-light">Iniciar Sesión</a>
            </div>

            <!-- Si SÍ está logeado -->
            <div
              class="d-flex align-items-center gap-3"
              th:if="${session.usuarioLogeado != null}"
            >
              <span class="text-white fw-bold">
                👤
                <span th:text="${session.usuarioLogeado.nombreUsuario}"></span>
              </span>

              <a href="/logout" class="btn btn-danger btn-sm">
                Cerrar Sesión
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>
