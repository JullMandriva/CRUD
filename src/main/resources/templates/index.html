<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Ferretería Toñito</title>
    <!-- CSS PERSONAL -->
    <link rel="stylesheet" href="/css/style.css" />
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/img/IconoFerreteria_2.png" />
    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <!-- ===== NAVBAR + NOTIFICACIONES ===== -->
    <div th:replace="fragments/navbar :: navbar"></div>
    <div th:replace="fragments/navbarExtra :: navbarExtra"></div>
    <div th:replace="fragments/notif :: notificaciones"></div>
    <!-- ===== CONTENIDO ===== -->
    <main class="flex-grow-1">
      <div class="container text-center mt-4">
        <h1 class="h3 fw-bold">Tu ferretería de confianza 🔧</h1>
        <p class="mt-2">
          Bienvenido a Ferretería Toñito, donde encontrarás herramientas,
          materiales y todo lo que necesitas para tus proyectos en un solo
          lugar.
        </p>
        <!-- ========= CAROUSEL ========= -->
        <div
          id="carouselExampleCaptions"
          class="carousel slide shadow-lg rounded mt-4"
          data-bs-ride="carousel"
        >
          <!-- Indicadores -->
          <div class="carousel-indicators">
            <button
              type="button"
              data-bs-target="#carouselExampleCaptions"
              data-bs-slide-to="0"
              class="active"
              aria-current="true"
            ></button>
            <button
              type="button"
              data-bs-target="#carouselExampleCaptions"
              data-bs-slide-to="1"
            ></button>
            <button
              type="button"
              data-bs-target="#carouselExampleCaptions"
              data-bs-slide-to="2"
            ></button>
          </div>
          <!-- Slides -->
          <div class="carousel-inner">
            <!-- SLIDE 1 -->
            <div class="carousel-item active">
              <img
                src="/img/OfertaSierra.png"
                class="d-block w-100"
                alt="Herramientas"
              />
              <div
                class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 p-2 rounded"
              ></div>
            </div>
            <!-- SLIDE 2 -->
            <div class="carousel-item">
              <img
                src="/img/llave.jpg"
                class="d-block w-100"
                alt="Materiales"
              />
              <div
                class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 p-2 rounded"
              ></div>
            </div>
            <!-- SLIDE 3 -->
            <div class="carousel-item">
              <img
                src="/img/ferreteria.jpg"
                class="d-block w-100"
                alt="Ferretería"
              />
              <div
                class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 p-2 rounded"
              ></div>
            </div>
          </div>
          <!-- Botones -->
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleCaptions"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleCaptions"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
        <!-- ========= FIN CAROUSEL ========= -->
      </div>
    </main>
    <!-- ===== FOOTER ===== -->
    <footer class="footer-full">
      <p class="mb-1">
        © 2025 Ferretería Toñito — Todos los derechos reservados.
      </p>
      <a
        href="https://wa.me/51936602622?text=Hola%20quiero%20información%20sobre%20un%20producto"
        target="_blank"
        class="wa-link"
        >📱 Contáctenos por WhatsApp</a
      >
    </footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
